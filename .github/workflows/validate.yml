name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 tools/validate.py
      - run: python3 tools/check_version_consistency.py

  check-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 tools/export_csv.py --check
      - run: python3 tools/export_sql.py --check

  check-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: CLI regression test (ACT/360 must return 30)
        run: |
          out=$(python3 cli.py get ACT/360 --start 2026-01-01 --end 2026-01-31)
          echo "cli output: $out"
          test "$out" = "30"
      - name: CLI coverage test (every fixture convention must be listed and calculable)
        run: python3 tools/check_cli_coverage.py

  check-wrappers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 -c "from fin_conventions import Convention; print(Convention.get('ACT/360').name)"
      - name: Wrapper coverage test (every fixture convention must be calculable)
        run: python3 tools/check_wrapper_coverage.py

  check-math-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest tests/test_conventions.py -v

  check-mojibake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_mojibake.py
